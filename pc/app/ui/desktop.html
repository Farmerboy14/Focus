<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>Focus desktop</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Everything is sized from the screen's height, so it looks the same on any monitor and in the still picture. */
  html { font-size: calc(100vh / 67.5); }
  html, body { background: #05070C; cursor: default; }
  /* The stars and the Earth animate in script and stop whenever the desktop is covered; no endless CSS animations. */
  .sky img, .dial .nowstar, .dial .tk, .dial .tk.on.glint { animation: none !important; }
  #stars { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); pointer-events: none; }
  .sky img { inset: 0; width: 100%; height: 100%; }
  /* Space: the Earth, the real sky, the Moon and planets, on one canvas behind everything */
  #space { position: absolute; inset: 0; width: 100%; height: 100%; display: none; cursor: grab; }
  body.gl #space { display: block; }
  body.gl .sky, body.gl #stars { display: none; }
  body.flying #space { cursor: grabbing; }
  .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .blabel { position: absolute; left: 0; top: 0; font-family: var(--mono); font-size: .66rem; letter-spacing: .2em; color: rgba(214, 223, 238, .62); white-space: nowrap; transition: opacity .4s ease; }
  .blabel::before { content: ''; display: inline-block; width: .9rem; height: 1px; margin-right: .45rem; vertical-align: .22rem; background: rgba(214, 223, 238, .35); }
  .blabel.flip::before { display: none; }
  .blabel.flip::after { content: ''; display: inline-block; width: .9rem; height: 1px; margin-left: .45rem; vertical-align: .22rem; background: rgba(214, 223, 238, .35); }
  .blabel.sun { color: rgba(255, 226, 170, .8); }
  .blabel.moon { color: rgba(232, 232, 238, .74); }
  body.still .labels { display: none; }

  /* Live flights */
  body.onplane #space, body.onworld #space { cursor: pointer; }
  .ptip { position: absolute; left: 0; top: 0; pointer-events: none; padding: .3rem .6rem; border-radius: .5rem; font-family: var(--mono); font-size: .66rem;
    letter-spacing: .12em; color: #F6EAD0; background: rgba(6, 9, 16, .82); border: 1px solid rgba(242, 211, 138, .25); opacity: 0; transition: opacity .15s ease; white-space: nowrap; }
  .pmark { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .3s ease; }
  .pmark::before, .pmark::after { content: ''; position: absolute; left: -1.25rem; top: -1.25rem; width: 2.5rem; height: 2.5rem; border-radius: 50%;
    border: 1.5px solid rgba(255, 228, 170, .85); animation: ping 2.4s ease-out infinite; }
  .pmark::after { animation-delay: 1.2s; }
  body.paused .pmark::before, body.paused .pmark::after { animation-play-state: paused; }
  .flight { position: absolute; left: 3.5rem; top: 3.5rem; width: 23rem; padding: 1.3rem 1.4rem 1.2rem; border-radius: 1.4rem; display: none;
    background-color: rgba(6, 9, 16, .82); border: 1px solid rgba(242, 211, 138, .2); backdrop-filter: blur(6px); }
  body.side-left .flight { left: auto; right: 3.5rem; }
  body.flight-open .flight { display: block; animation: rise .35s var(--spring); }
  @keyframes rise { from { opacity: 0; transform: translateY(.6rem); } to { opacity: 1; transform: none; } }
  .flight .top { display: flex; align-items: center; justify-content: space-between; }
  .flight .top span { font-family: var(--mono); font-size: .7rem; letter-spacing: .2em; color: var(--gold-deep); }
  .flight .x { width: 2rem; height: 2rem; border-radius: 50%; font-size: 1.2rem; line-height: 1; color: var(--muted); border: 1px solid rgba(170, 207, 246, .14); background: none; }
  .world .x { width: 2rem; height: 2rem; border-radius: 50%; font-size: 1.2rem; line-height: 1; color: var(--muted); border: 1px solid rgba(170, 207, 246, .14); background: none; }
  .world .x:hover { color: var(--ink); border-color: rgba(170, 207, 246, .4); }
  .flight .x:hover { color: var(--ink); border-color: rgba(170, 207, 246, .4); }
  .flight h3 { margin: .5rem 0 0; font-weight: 500; font-size: 1.9rem; letter-spacing: -.01em; color: #F6EAD0; }
  .flight .al { margin-top: .15rem; font-size: .98rem; color: var(--soft); min-height: 1.2rem; }
  .flight img { display: block; width: 100%; height: 8.5rem; object-fit: cover; border-radius: .9rem; margin-top: .9rem; opacity: .92; }
  .flight .route { display: grid; grid-template-columns: auto 1fr auto; gap: .9rem; align-items: center; margin-top: 1rem; }
  .flight .route:empty { display: none; }
  .flight .end b { display: block; font-family: var(--mono); font-weight: 400; font-size: 1.25rem; letter-spacing: .06em; color: var(--ink); }
  .flight .end span { display: block; font-size: .78rem; color: var(--muted); max-width: 6.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flight .end:last-child { text-align: right; }
  .flight .bar { position: relative; height: 2px; background: rgba(170, 207, 246, .16); border-radius: 2px; }
  .flight .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255, 228, 170, .8); border-radius: 2px; }
  .flight .bar em { position: absolute; top: 50%; width: .55rem; height: .55rem; margin: -.275rem 0 0 -.275rem; border-radius: 50%; background: #FFE7B0; box-shadow: 0 0 .6rem rgba(255, 220, 150, .7); }
  .flight .left2 { margin-top: .55rem; font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; color: var(--muted); }
  .flight .facts { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem 1rem; margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid rgba(170, 207, 246, .1); }
  .flight .facts span { display: block; font-family: var(--mono); font-size: .62rem; letter-spacing: .16em; color: var(--quiet); }
  .flight .facts b { display: block; margin-top: .2rem; font-weight: 400; font-size: 1rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flight .own { margin-top: .9rem; font-size: .82rem; color: var(--muted); }
  .flight .own:empty { display: none; }
  .flight .src { margin-top: .8rem; font-family: var(--mono); font-size: .56rem; letter-spacing: .1em; color: var(--quiet); opacity: .7; }
  body.still .flight, body.still .pmark, body.still .ptip { display: none !important; }

  /* Visiting a world */
  .blabel { pointer-events: auto; cursor: pointer; }
  .blabel:hover { color: #F6EAD0; }
  body.visiting .labels, body.visiting .earth .home, body.visiting .earth .cap, body.visiting .pmark, body.visiting .ptip { opacity: 0 !important; pointer-events: none; }
  body.visiting .earth .cap, body.visiting .labels { transition: opacity .6s ease; }
  body.visiting #space { cursor: grab; }
  .world { position: absolute; left: 3.5rem; top: 3.5rem; width: 24rem; padding: 1.4rem 1.5rem 1.2rem; border-radius: 1.4rem; display: none;
    background-color: rgba(6, 9, 16, .8); border: 1px solid rgba(242, 211, 138, .2); backdrop-filter: blur(6px); }
  body.side-left .world { left: auto; right: 3.5rem; }
  body.world-open .world { display: block; animation: rise .5s var(--spring) 1.2s both; }
  .world .top { display: flex; align-items: center; justify-content: space-between; }
  .world .top span { font-family: var(--mono); font-size: .7rem; letter-spacing: .2em; color: var(--gold-deep); }
  .world h3 { margin: .45rem 0 0; font-family: var(--serif); font-weight: 400; font-size: 2.5rem; line-height: 1.05; color: #F6EAD0; }
  .world .what { margin-top: .3rem; font-size: .98rem; color: var(--soft); }
  .world .wnow { margin-top: 1rem; padding: .85rem 1rem; border-radius: .9rem; background: rgba(170, 207, 246, .05); border: 1px solid rgba(170, 207, 246, .1);
    font-size: .95rem; line-height: 1.5; color: #DADDE3; }
  .world .wnow b { font-weight: 500; color: var(--ink); }
  .world .facts { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem 1rem; margin-top: 1.1rem; }
  .world .facts span { display: block; font-family: var(--mono); font-size: .6rem; letter-spacing: .14em; color: var(--quiet); }
  .world .facts b { display: block; margin-top: .2rem; font-weight: 400; font-size: 1rem; color: var(--ink); }
  .world .note { margin-top: 1rem; font-size: .95rem; line-height: 1.5; color: var(--soft); }
  .world .vs { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid rgba(170, 207, 246, .1); }
  .world .vs q { quotes: none; display: block; font-family: var(--serif); font-style: italic; font-size: 1.05rem; line-height: 1.4; color: #EFEDE6; }
  .world .vs span { display: block; margin-top: .35rem; font-family: var(--mono); font-size: .62rem; letter-spacing: .16em; color: var(--muted); }
  .world .vs.hit:hover span { color: var(--gold-deep); }
  .world .hint { margin-top: .8rem; font-family: var(--mono); font-size: .58rem; letter-spacing: .12em; color: var(--quiet); opacity: .7; }
  .world .src { margin-top: .3rem; font-family: var(--mono); font-size: .54rem; letter-spacing: .1em; color: var(--quiet); opacity: .55; }
  body.still .world { display: none !important; }
  .sky .dawn { transition: opacity 2.4s ease; }
  .shade { position: absolute; inset: 0; pointer-events: none; transition: opacity 1s ease;
    background: linear-gradient(to left, rgba(4, 6, 11, .62) 0%, rgba(4, 6, 11, .38) 34%, rgba(4, 6, 11, 0) 62%); }
  body.side-left .shade { transform: scaleX(-1); }

  .col { position: absolute; top: 0; bottom: 0; right: 6.5rem; width: 37rem; display: flex; flex-direction: column; justify-content: center; padding: 4rem 0 6.5rem; }
  body.side-left .col { right: auto; left: 7.5rem; }

  /* The Earth, on the open side of the screen */
  /* Centred in the open part of the screen and never wider than it, so it clears the schedule on any shape of monitor */
  .earth { --free: calc(100vw - 45rem); --size: min(50rem, calc(var(--free) * .84)); position: absolute; top: 50%; left: calc(var(--free) / 2);
    width: var(--size); height: var(--size); transform: translate(-50%, -54%); pointer-events: none; }
  body.side-left .earth { left: calc(45rem + var(--free) / 2); }
  .earth .home { position: absolute; width: 0; height: 0; pointer-events: none; transition: opacity .4s ease; }
  .earth .home::before, .earth .home::after { content: ''; position: absolute; left: -1.1rem; top: -1.1rem; width: 2.2rem; height: 2.2rem; border-radius: 50%;
    border: 1.5px solid rgba(242, 211, 138, .8); animation: ping 3.2s ease-out infinite; }
  .earth .home::after { animation-delay: 1.6s; }
  @keyframes ping { 0% { transform: scale(.25); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
  body.paused .earth .home::before, body.paused .earth .home::after { animation-play-state: paused; }
  .earth .cap { position: absolute; left: 0; right: 0; bottom: -4.2rem; text-align: center; pointer-events: none; }
  .earth .cap b { display: block; font-family: var(--mono); font-weight: 400; font-size: .76rem; letter-spacing: .22em; color: var(--muted); }
  .earth .cap span { display: block; margin-top: .45rem; font-size: 1.05rem; color: var(--soft); }
  .earth .cap i { display: block; margin-top: .35rem; font-style: normal; font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; color: var(--quiet); opacity: .8; }
  .earth .cap em { display: block; margin-top: .3rem; font-style: normal; font-family: var(--mono); font-size: .6rem; letter-spacing: .12em; color: var(--quiet); opacity: .6; }
  body.still .earth .cap i { display: none; }

  /* Things you can touch: they answer the mouse even through the desktop */
  .hit { cursor: pointer; transition: background-color .25s ease, border-color .25s ease, transform .3s var(--spring), color .25s ease; }
  .card.hit:hover { border-color: rgba(170, 207, 246, .3); }
  body.gold .card.hit:hover { border-color: rgba(242, 211, 138, .45); }
  .actions { display: flex; gap: .7rem; margin-top: 1.1rem; }
  .act { display: inline-flex; align-items: center; gap: .55rem; min-height: 2.7rem; padding: 0 1.15rem; border-radius: 999px; font-size: .98rem; color: #E6E9EF;
    background-color: rgba(6, 9, 16, .66); border: 1px solid rgba(170, 207, 246, .14); backdrop-filter: blur(4px); }
  .act:hover { border-color: rgba(170, 207, 246, .36); background-color: rgba(14, 20, 34, .8); transform: translateY(-1px); }
  .act:active { transform: translateY(1px) scale(.97); }
  .act.gold { color: var(--gold); border-color: rgba(242, 211, 138, .22); }
  .act.gold:hover { border-color: rgba(242, 211, 138, .5); }
  .act svg { width: 1.05rem; height: 1.05rem; }
  body.still .actions { display: none; }

  .date { font-family: var(--mono); font-size: .95rem; letter-spacing: .2em; color: var(--soft); }
  .clock { font-weight: 300; font-size: 8.6rem; line-height: .95; letter-spacing: -.045em; font-variant-numeric: tabular-nums; margin: .5rem 0 0 -.4rem; color: #F3F4F7; }
  .clock small { font-size: 2.2rem; letter-spacing: .02em; margin-left: .8rem; color: var(--muted); font-weight: 400; }

  .card { margin-top: 2.4rem; border-radius: 1.6rem; padding: 1.4rem 1.8rem 1.4rem 1.2rem; display: grid; grid-template-columns: 12.5rem minmax(0, 1fr); gap: 1.4rem; align-items: center;
    background-color: rgba(6, 9, 16, .74); border-color: rgba(170, 207, 246, .14); background-size: 6rem; }
  body.gold .card { border-color: rgba(242, 211, 138, .26); }
  .dialhost { width: 12.5rem; height: 12.5rem; }
  .dialhost svg { width: 100%; height: 100%; }
  .now { display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
  .nowlabel { font-family: var(--mono); font-size: .78rem; letter-spacing: .16em; color: var(--muted); }
  body.gold .nowlabel { color: var(--gold-deep); }
  .title { font-size: 1.95rem; font-weight: 500; line-height: 1.15; letter-spacing: -.01em; }
  body.gold .title { color: var(--gold); }
  .note { font-size: 1.06rem; line-height: 1.45; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .left { font-family: var(--mono); font-size: .86rem; letter-spacing: .12em; color: var(--muted); margin-top: .2rem; }
  .left b { font-family: var(--sans); font-weight: 400; font-size: 1.5rem; letter-spacing: -.02em; color: var(--ink); margin-right: .5rem; }
  body.gold .left b { color: var(--gold); }

  .later { margin-top: 2rem; padding: 0 .4rem; }
  .later .label { font-size: .78rem; letter-spacing: .16em; display: block; margin-bottom: .5rem; }
  .row { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr) auto; align-items: baseline; gap: 1rem; padding: .62rem 0; border-top: 1px solid rgba(170, 207, 246, .08); }
  .row:first-of-type { border-top: 0; }
  .row .t { font-family: var(--mono); font-size: .9rem; letter-spacing: .04em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .n { font-size: 1.12rem; color: #DADDE3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .p { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; color: var(--muted); opacity: .8; }
  .row.god .n, .row.god .p { color: var(--gold); }
  .row.free .p { color: #BFE3C8; }
  .row.day { grid-template-columns: 1fr; padding: .9rem 0 .2rem; border-top: 0; }
  .row.hit { margin: 0 -.7rem; padding-left: .7rem; padding-right: .7rem; border-radius: .8rem; }
  .row.hit:hover { background-color: rgba(170, 207, 246, .06); border-top-color: transparent; }
  .row .x { grid-column: 2 / 4; font-size: .98rem; line-height: 1.45; color: var(--soft); margin-top: .35rem; display: none; }
  .row.open .x { display: block; }
  .row.open .n { white-space: normal; }
  .row.day span { font-family: var(--mono); font-size: .72rem; letter-spacing: .18em; color: var(--quiet); }

  .verse { margin-top: 2.2rem; padding: 1.4rem .4rem 0; border-top: 1px solid rgba(170, 207, 246, .1); }
  .verse q { quotes: none; display: block; font-family: var(--serif); font-style: italic; font-size: 1.42rem; line-height: 1.4; color: #EFEDE6; }
  .verse span { display: block; margin-top: .7rem; font-family: var(--mono); font-size: .74rem; letter-spacing: .16em; color: var(--muted); }
  .verse.hit { margin-left: -.7rem; margin-right: -.7rem; padding-left: 1.1rem; padding-right: 1.1rem; padding-bottom: .9rem; border-radius: 0 0 1rem 1rem; }
  .verse.hit:hover { background-color: rgba(242, 211, 138, .05); }
  .verse.hit:hover span { color: var(--gold-deep); }

  /* The still picture (when the live layer can't attach) leaves out anything that would go stale. */
  body.still .clock, body.still .left b { display: none; }
  body.still .card { margin-top: 1.4rem; }
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"><img src="../res/img/desk_night.jpg" alt=""><img class="dawn" src="../res/img/desk_dawn.jpg" alt=""></div>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="space" aria-label="The Earth and the sky right now. Drag to fly around the Earth."></canvas>
<div class="labels" id="labels" aria-hidden="true"></div>
<div class="pmark" id="planeMark" aria-hidden="true"></div>
<div class="ptip" id="planeTip" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>
<section class="earth" id="earth" aria-label="The Earth right now">
  <div class="home" id="home"></div>
  <div class="cap"><b>EARTH RIGHT NOW</b><span id="earthLine"></span><i id="earthHint">DRAG TO FLY AROUND IT · SCROLL TO ZOOM</i><em id="flightLine"></em><em id="cloudLine"></em></div>
</section>
<section class="world" id="world" aria-live="polite">
  <div class="top"><span id="wKind">VISITING</span><button class="x hit" id="wClose" title="Back to Earth">×</button></div>
  <h3 id="wName"></h3>
  <div class="what" id="wWhat"></div>
  <div class="wnow" id="wNow"></div>
  <div class="facts" id="wFacts"></div>
  <div class="note" id="wNote"></div>
  <div class="vs hit" id="wVerse" title="Read the chapter"><q id="wVerseText"></q><span id="wVerseRef"></span></div>
  <div class="hint">DRAG TO ORBIT · SCROLL TO ZOOM · × FLIES HOME</div>
  <div class="src">MAPS: SOLAR SYSTEM SCOPE (CC BY 4.0), FROM NASA DATA</div>
</section>
<section class="flight" id="flight" aria-live="polite">
  <div class="top"><span>FLIGHT</span><button class="x hit" id="fClose" title="Close">×</button></div>
  <h3 id="fCall"></h3>
  <div class="al" id="fAirline"></div>
  <img id="fPhoto" class="hidden" alt="">
  <div class="route" id="fRoute"></div>
  <div class="left2" id="fLeft"></div>
  <div class="facts" id="fFacts"></div>
  <div class="own" id="fOwner"></div>
  <div class="src">OPENSKY NETWORK · AIRPLANES.LIVE · ADSBDB</div>
</section>
<main class="col">
  <span class="date" id="date"></span>
  <span class="clock" id="clock"></span>
  <section class="card stone hit" id="card" title="Open Focus">
    <div class="dialhost" id="dial"></div>
    <div class="now">
      <span class="nowlabel" id="nowLabel"></span>
      <span class="title" id="title"></span>
      <span class="note hidden" id="note"></span>
      <span class="left" id="left"></span>
    </div>
  </section>
  <nav class="actions" id="actions">
    <button class="act gold hit" data-act="god"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M7 8h10"/></svg>Time with God</button>
    <button class="act hit" data-act="phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>My phone</button>
    <button class="act hit" data-act="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>My week</button>
  </nav>
  <section class="later" id="laterBox">
    <span class="label">LATER</span>
    <div id="later"></div>
  </section>
  <section class="verse hit" id="verseBox" title="Read the chapter"><q id="verse"></q><span id="ref"></span></section>
</main>
<script src="../lib/schedule.js"></script>
<script src="../lib/bible.js"></script>
<script src="common.js"></script>
<script src="stars.js"></script>
<script src="stars-data.js"></script>
<script src="sky.js"></script>
<script src="worlds.js"></script>
<script src="earth.js"></script>
<script src="desktop.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>Not now</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="notnow.css">
</head>
<body>
<div class="nn" id="nn" data-kind="block">
  <button class="scrim plain" id="scrim" aria-label="Close"></button>
  <section class="slab" id="slab" role="dialog" aria-labelledby="big">
    <span class="grab" aria-hidden="true"></span>
    <div class="it" style="--i:0">
      <span class="label tag" id="tag"></span>
      <h1 id="big">Not now.</h1>
    </div>
    <div class="it" style="--i:1">
      <p class="msg" id="msg"></p>
      <span class="mono nowline" id="nowline"></span>
    </div>
    <div class="it reason" style="--i:2" id="reasonBox">
      <textarea class="field" id="reason" rows="2" placeholder="Why do you need it right now?" aria-label="Your reason"></textarea>
      <button class="btn openbtn" id="open" disabled>Open for 10 minutes</button>
    </div>
    <div class="it" style="--i:3">
      <button class="goldbtn wide" id="back"></button>
      <button class="plain closebtn" id="close">Close</button>
    </div>
  </section>
</div>
<script src="common.js"></script>
<script src="notnow.js"></script>
</body>
</html>
